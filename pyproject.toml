[project]
name = "marketing-intelligence"
version = "0.1.0"
description = "B2B SaaS marketing intelligence — multi-service analytics monorepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "faker>=18.0",
    "streamlit>=1.32",
    "plotly>=5.18",
    "pyarrow>=14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
